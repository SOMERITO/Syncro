<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B1 sin costo de Matrícula</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        h2 { 
            color: #333; 
            margin-bottom: 20px;
        }
        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #555; 
            font-weight: 600; 
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="number"]:focus {
            border-color: #0056b3;
            outline: none;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        button:hover { 
            background-color: #004494; 
        }
        button:active {
            transform: scale(0.98);
        }
        .result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #28a745;
            min-height: 26px;
        }
        .error {
            color: #dc3545;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>B1 sin costo de Matrícula</h2>
        <div class="input-group">
            <label for="monto">Monto de la boleta (S/):</label>
            <input type="number" id="monto" placeholder="Ej. 1500.00" step="0.01">
        </div>
        <button onclick="calcularTotal()">Calcular Total</button>
        <div class="result" id="resultado"></div>
    </div>

    <script>
        function calcularTotal() {
            const inputMonto = document.getElementById('monto').value;
            const monto = parseFloat(inputMonto);
            const descuento = 365.00;
            const resultadoDiv = document.getElementById('resultado');

            if (isNaN(monto) || inputMonto.trim() === "") {
                resultadoDiv.className = 'result error';
                resultadoDiv.textContent = 'Por favor, ingrese un monto válido.';
                return;
            }

            const total = monto - descuento;

            resultadoDiv.className = 'result';
            resultadoDiv.textContent = `Total a pagar: S/ ${total.toFixed(2)}`;
        }
    </script>

</body>
</html>
